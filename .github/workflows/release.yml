name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.3)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write

env:
  # The corpus-backed tests read the pinned testsuite (same ref as ci.yml).
  TESTSUITE_REF: 548b2d11e45534bafb44b5564d11c05e8ef9b3f8

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ env.TESTSUITE_REF }}
          path: pubid-testsuite
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TESTSUITE_DIR: ${{ github.workspace }}/pubid-testsuite/tests
      - name: Set version from workflow input (patch release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi
      - run: npm publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
