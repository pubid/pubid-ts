# ansi dash-form wave (relaton#45, pubid 0f7ba38b): the 35 ieee
# adopted_standard rows whose nested ANSI id carries a trailing dash
# year. The round re-classifies the "-YYYY" tail as the date
# (date_separator "-", the "ANSI C37.24-1971" spelling); these rows
# predate the wave (the testsuite ieee round last re-froze at pubid main
# 2026-11-15) and still record the old part-keyed hash. The REFERENCE
# fails the same rows the same way (its conformance run over the same
# tree prints FAIL ieee.adopted_standard.* canonical hash), so this is
# the corpus waiting for its re-freeze, not a port gap. Unmark when the
# ieee round re-freezes at a post-wave pubid ref.
