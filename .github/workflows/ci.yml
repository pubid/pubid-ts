name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: push/PR event delivery for this repo was down for >24h
  # (GitHub-side); dispatch lets CI run on a branch without waiting on events.
  workflow_dispatch:

env:
  # Cross-repo law: the corpus is consumed at a PINNED ref; schema/corpus
  # changes always land in pubid (Ruby) PRs first, then this pin bumps.
  TESTSUITE_REF: 582741be1a63fd7cbb243e6cb38b0ac1f4a63db3

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ env.TESTSUITE_REF }}
          path: pubid-testsuite
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
        env:
          TESTSUITE_DIR: ${{ github.workspace }}/pubid-testsuite/tests
      - name: Conformance report (bootstrap; unimplemented flavors report, never gate)
        run: npm run conformance -- $TESTSUITE_DIR conformance/pending.yaml
        working-directory: .
        env:
          TESTSUITE_DIR: ${{ github.workspace }}/pubid-testsuite/tests
