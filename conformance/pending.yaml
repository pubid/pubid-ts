# Draft word returns) and the dash-DIS/ED4 humans do not round-trip at
# all; the ruby verify documents the divergence (tests/ieee/_status.yaml,
# the bare ISO/IEC joint-rows family). The ts pends until the gem lands
# the word-stage joint route (pubid#538 follow-up), then mirrors it.

