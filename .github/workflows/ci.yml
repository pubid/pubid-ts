name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: push/PR event delivery for this repo was down for >24h
  # (GitHub-side); dispatch lets CI run on a branch without waiting on events.
  workflow_dispatch:

env:
  # Cross-repo law: the corpus is consumed at a PINNED ref; schema/corpus
  # changes always land in pubid (Ruby) PRs first, then this pin bumps.
  TESTSUITE_REF: ""
  # Same law for the grammar runtime: the baked PARG artifacts are
  # consumed at a pinned pubid-grammar ref (grammar PRs land first, then
  # this pin bumps). PARG_ARTIFACT_DIR points src/parg/runtime.ts there.
  PARG_GRAMMAR_REF: ""

jobs:
  # The per-flavor corpus loops dominate wall time (ieee alone ~6.5 min
  # inside one test file), so the files are sharded across parallel
  # runners instead of running the whole suite in one job.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve shared pins
        run: |
          echo "TESTSUITE_REF=$(awk '/^testsuite_ref:/{print $2}' .github/pins.yaml)" >> "$GITHUB_ENV"
          echo "PARG_GRAMMAR_REF=$(awk '/^grammar_ref:/{print $2}' .github/pins.yaml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ env.TESTSUITE_REF }}
          path: pubid-testsuite
      - uses: actions/checkout@v7
        with:
          repository: pubid/pubid-grammar
          ref: ${{ env.PARG_GRAMMAR_REF }}
          path: pubid-grammar
      # The retrieval conformance pack's sibling-checkout default: the
      # executor runs relaton's shared fixture on every CI run.
      - uses: actions/checkout@v7
        with:
          repository: relaton/relaton
          ref: main
          path: relaton/relaton
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc -p tsconfig.json && npx tsc -p tsconfig.test.json
      # Track 04: the pinned grammar ref must be internally consistent —
      # every artifact fresh against its .parg source and every F4 corpus
      # case reproduced by the wasm engine — and the vendored artifacts
      # must match that ref exactly (the package ships them, so a stale
      # vendor/parg would ship an unverified engine payload).
      - name: Cross-engine corpus gate (pinned grammar ref)
        run: |
          PARG_ARTIFACT_DIR="${{ github.workspace }}/pubid-grammar/artifacts" \
          PARG_CORPORA_DIR="${{ github.workspace }}/pubid-grammar/corpora" \
          PARG_GRAMMAR_DIR="${{ github.workspace }}/pubid-grammar/grammars" \
            node scripts/corpus-parity.mjs
      - name: Vendored artifacts match the pinned grammar ref
        run: |
          diff -r -x '*.parg' vendor/parg "${{ github.workspace }}/pubid-grammar/artifacts" || {
            echo "::error::vendor/parg is stale against grammar_ref — run npm run artifact"
            exit 1
          }
      # pubid#577: the committed API reference is generated — a hand edit
      # or a docstring change without a regen fails here.
      - name: API reference drift gate
        run: |
          node scripts/api-reference.mjs
          git diff --exit-code docs/api-reference.md || {
            echo "::error::docs/api-reference.md is stale — run npm run doc:api"
            exit 1
          }
      - run: node --test --test-shard=${{ matrix.shard }}/4 dist-test/test/*.test.js
        env:
          TESTSUITE_DIR: ${{ github.workspace }}/pubid-testsuite/tests
          PARG_ARTIFACT_DIR: ${{ github.workspace }}/pubid-grammar/artifacts

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve shared pins
        run: |
          echo "TESTSUITE_REF=$(awk '/^testsuite_ref:/{print $2}' .github/pins.yaml)" >> "$GITHUB_ENV"
          echo "PARG_GRAMMAR_REF=$(awk '/^grammar_ref:/{print $2}' .github/pins.yaml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: pubid/pubid-testsuite
          ref: ${{ env.TESTSUITE_REF }}
          path: pubid-testsuite
      - uses: actions/checkout@v7
        with:
          repository: pubid/pubid-grammar
          ref: ${{ env.PARG_GRAMMAR_REF }}
          path: pubid-grammar
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - name: Conformance report (bootstrap; unimplemented flavors report, never gate)
        run: npm run conformance -- $TESTSUITE_DIR conformance/pending.yaml
        working-directory: .
        env:
          TESTSUITE_DIR: ${{ github.workspace }}/pubid-testsuite/tests
          PARG_ARTIFACT_DIR: ${{ github.workspace }}/pubid-grammar/artifacts
