      (year + D4 + stage) and the unpromoted comma-draft one; the ruby
      parses to the promoted shape, so the unpromoted twin cannot
      round-trip in any engine (the ruby verify's known mismatches)
  ref: conformance/pending.yaml (gem 8c03e19a word-stage family)


